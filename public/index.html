<!DOCTYPE html>
<html>
<head>
    <title>Poké-Engine</title>
    <meta charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="css/style.game.css">
    <!-- Tạm thời ẩn các stylesheet của hệ thống Battle và Status Bar chưa triển khai để tránh cảnh báo MIME 404 trên Console -->
    <!-- <link type="text/css" rel="stylesheet" href="css/battle.game.css"> -->
    <!-- <link type="text/css" rel="stylesheet" href="css/bar.game.css"> -->
    <link type="text/css" rel="stylesheet" href="css/character.game.css">
    <link type="text/css" rel="stylesheet" href="css/overworld.pokemon.css">
    <link type="text/css" rel="stylesheet" href="css/icon.game.css">
    <link type="text/css" rel="stylesheet" href="css/hud.modern.css">
</head>
<body>
    <div id="mask"></div>
    <div id="content">
        <div id="game">
            <div id="level">
                <div id="all-in-world">
                    <div id="world">
                        <div id="map"></div>
                        <div id="map-overlay"></div>
                        <div id="player"></div>
                    </div>
                    <div id="map-objects"></div>
                </div>
                <div id="level-menu">
                    <ul>
                        <li class="level-icon icon-pokeball"></li>
                        <li class="level-icon icon-bag"></li>
                        <li class="level-icon icon-config"></li>
                    </ul>
                </div>
                <div id="load_layer">
                    <img alt="Carregando..." title="Carregando..." class="img_loader" src="img/loader.gif">
                </div>
                <div id="battle"></div>
                <div id="trainer-hud">
                    <div class="trainer-badge">
                        <span class="trainer-status-dot" aria-hidden="true"></span>
                        <span id="trainer-name">Trainer</span>
                    </div>
                    <button id="btn-logout" type="button" title="Đăng xuất khỏi trò chơi">Thoát</button>
                </div>
                <div id="dialogue-box" class="dialogue-box" style="display: none;">
                    <div class="dialogue-frame">
                        <p id="dialogue-text"></p>
                        <span class="dialogue-arrow">&#x25BC;</span>
                    </div>
                </div>
            </div>
            <div id="cache"></div>
            <div id="modern-hud-root"></div>
        </div>
    </div>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/async/2.6.2/async.min.js"></script>
    <script type="text/javascript" src="js/socket.io.js"></script>
    <script type="text/javascript" src="js/engine/index.js"></script>
    <script type="text/javascript" src="js/engine/gamedata.js"></script>
    <script type="text/javascript" src="js/engine/load.js"></script>
    <script type="text/javascript" src="js/engine/online.js"></script>
    <script type="text/javascript" src="js/engine/gameobjects.js"></script>
    <script type="text/javascript" src="js/engine/keyboard.js"></script>
    <script type="text/javascript" src="js/engine/map.js"></script>
    <script type="text/javascript" src="js/engine/camera.js"></script>
    <script type="text/javascript" src="js/engine/overworldPokemon.js"></script>

    <!-- Modern RPG HUD, Inventory, Equipment & Character Systems -->
    <script type="text/javascript" src="js/engine/ui/itemCatalog.js"></script>
    <script type="text/javascript" src="js/engine/ui/itemEffectRegistry.js"></script>
    <script type="text/javascript" src="js/engine/ui/inventoryService.js"></script>
    <script type="text/javascript" src="js/engine/ui/modalManager.js"></script>
    <script type="text/javascript" src="js/engine/ui/hud.js"></script>
    <script type="text/javascript" src="js/engine/ui/inventoryUI.js"></script>
    <script type="text/javascript" src="js/engine/ui/shopUI.js"></script>
    <script type="text/javascript" src="js/engine/ui/itemEncyclopediaUI.js"></script>
    <script type="text/javascript" src="js/engine/ui/equipmentUI.js"></script>
    <script type="text/javascript" src="js/engine/ui/characterUI.js"></script>
    <script type="text/javascript" src="js/engine/pokemon/pokemonInstance.js"></script>
    <script type="text/javascript" src="js/engine/pokemon/pokemonPartyService.js"></script>
    <script type="text/javascript" src="js/engine/ui/pokedexProgressService.js"></script>
    <script type="text/javascript" src="js/engine/ui/pokemonUI.js"></script>
    <script type="text/javascript" src="js/engine/ui/pokedexUI.js"></script>
    <script type="text/javascript" src="js/engine/ui/starterSelectionUI.js"></script>
    <script type="text/javascript" src="js/engine/ui/miniBattleUI.js"></script>
    <script type="text/javascript" src="js/engine/boot.js"></script>
</body>
</html>
